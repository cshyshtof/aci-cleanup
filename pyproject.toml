[project]
name = "aci-cleanup"
version = "1.0.0"
description = "Cisco ACI factory reset automation"
requires-python = ">=3.12"
dependencies = [
    "paramiko>=4.0",
    "prettytable>=3.17",
    "pyvmomi>=9.1.0.0",
    "requests>=2.33",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
